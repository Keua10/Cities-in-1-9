<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>저택 한 개 · 바닥 수정 후보</title>
    <style>
      body {
        margin: 24px;
        background: #192f30;
        color: #eef1e7;
        font: 15px system-ui;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }
      p {
        line-height: 1.7;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      article {
        background: #263e3d;
        border: 1px solid #54706b;
        border-radius: 10px;
        padding: 18px;
      }
      h2 {
        font-size: 18px;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        max-width: 100%;
        height: auto;
      }
      button,
      select {
        color: #eef1e7;
        background: #375b50;
        border: 1px solid #83ab94;
        padding: 8px 12px;
        font: inherit;
        margin: 0 10px 18px 0;
      }
      a {
        color: #8fe3d2;
      }
      .meta {
        max-width: 480px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>주거 L3 저택 · 원본 색감 복원 후보 v2</h1>
    <p>
      왼쪽은 기존 그림, 오른쪽은 원본 팔레트에 맞춘 후보입니다. 게임과 동일한 64×32 타일 좌표와 건물
      하단 기준점을 사용합니다.<br />청록색은 실제 3×3 설치 부지의 경계입니다. 그림 위의 선은
      비교용이며 PNG에는 포함되지 않습니다.
    </p>
    <button id="layout">연속 배치 6채 보기</button>
    <button id="grid">부지 경계 숨기기</button>
    <label
      >배율
      <select id="zoom">
        <option value="1">100%</option>
        <option value="2" selected>200%</option>
        <option value="3">300%</option>
      </select></label
    >
    <main></main>
    <p>
      수정 후보:
      <a href="/sprites/review/residential-l3-a-footprint-v2.png" download>192×192 투명 PNG</a> ·
      검토용 파일이며 현재 게임 아틀라스에는 적용하지 않았습니다.
    </p>
    <script type="module" src="./mansionFootprintVisual.ts"></script>
  </body>
</html>
