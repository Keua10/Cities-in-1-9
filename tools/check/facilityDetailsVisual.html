<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>특수시설 26종 · 상세 도트와 부지 검수</title>
    <style>
      body {
        margin: 20px;
        background: #192f30;
        color: #eef1e7;
        font: 15px system-ui;
      }
      h1 {
        font-size: 24px;
      }
      p {
        line-height: 1.7;
      }
      button,
      select {
        font: inherit;
        background: #34564d;
        color: #eef1e7;
        border: 1px solid #6f9787;
        padding: 8px 12px;
        margin: 0 8px 12px 0;
      }
      a {
        color: #95d8c8;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      article {
        padding: 14px;
        background: #263e3d;
        border: 1px solid #54706b;
        border-radius: 8px;
        max-width: calc(100vw - 70px);
      }
      h2 {
        font-size: 18px;
      }
      .scroll {
        overflow: auto;
      }
      canvas,
      img {
        image-rendering: pixelated;
        display: block;
      }
      #catalog {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }
      #catalog button {
        padding: 10px;
        text-align: left;
        margin: 0;
      }
      #catalog img {
        margin: auto;
      }
      #catalog span {
        display: block;
        margin-top: 8px;
      }
      #status {
        min-height: 24px;
      }
      .controls {
        position: sticky;
        top: 0;
        background: #192f30;
        z-index: 2;
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>특수시설 26종 · 상세 도트와 부지 검수</h1>
    <p>
      기존 시설과 새 시설을 같은 게임 좌표와 도트 크기로 비교합니다. 주변 주택·상가와 함께 보거나
      연속 배치할 수 있습니다.<br />승인한 건물 3종의 RGB 팔레트를 사용했습니다. 청록색 선은 실제
      설치 부지입니다.
    </p>
    <div class="controls">
      <label
        >시설
        <select id="facility"></select></label
      ><label
        >배치
        <select id="mode">
          <option value="mixed">주변 건물과 함께</option>
          <option value="single">한 채</option>
          <option value="repeat">연속 3채</option>
        </select></label
      ><label
        >배율
        <select id="zoom">
          <option value="1" selected>100%</option>
          <option value="2">200%</option>
          <option value="3">300%</option>
        </select></label
      ><button id="grid">부지 경계 숨기기</button>
    </div>
    <p id="status"></p>
    <main>
      <article>
        <h2>기존 게임 시설</h2>
        <div class="scroll"><canvas id="before"></canvas></div>
      </article>
      <article>
        <h2>새 게임 적용본</h2>
        <div class="scroll"><canvas id="after"></canvas></div>
      </article>
    </main>
    <p>
      <a id="scene" href="./facilityDetailsScene.html">실제 게임 렌더러에서 보기</a> ·
      <a href="./buildingFootprintsVisual.html">주거·상업·공업 36종</a>
    </p>
    <h2>26종 전체 · 100% 도트 크기</h2>
    <div id="catalog"></div>
    <script type="module" src="./facilityDetailsVisual.ts"></script>
  </body>
</html>
