<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>건물 36종 · 원본 색감과 바닥 규격 비교</title>
    <style>
      body {
        margin: 20px;
        background: #192f30;
        color: #eef1e7;
        font: 15px system-ui;
      }
      h1 {
        font-size: 24px;
      }
      p {
        line-height: 1.65;
      }
      button,
      select {
        background: #34564d;
        color: #eef1e7;
        border: 1px solid #6f9787;
        padding: 8px 12px;
        font: inherit;
        margin: 0 8px 12px 0;
      }
      a {
        color: #95d8c8;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      article {
        padding: 14px;
        background: #263e3d;
        border: 1px solid #54706b;
        border-radius: 8px;
        max-width: calc(100vw - 70px);
      }
      .scroll {
        overflow: auto;
      }
      canvas,
      img {
        image-rendering: pixelated;
        display: block;
      }
      h2 {
        font-size: 18px;
      }
      #catalog {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 24px;
      }
      #catalog button {
        width: 218px;
        padding: 10px;
        margin: 0;
        text-align: left;
      }
      #catalog img {
        width: auto;
        height: auto;
        max-width: 192px;
        margin: auto;
      }
      .thumb {
        height: 194px;
        display: flex;
        align-items: end;
        justify-content: center;
      }
      #catalog span {
        display: block;
        margin-top: 8px;
      }
      #status {
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <h1>주거·상업·공업 36종 · 원본과 규격 보정 비교</h1>
    <p>
      각 그림의 원본 팔레트를 유지했습니다. 청록색은 게임 설치 부지이며, 원래의 정원·보도 여백은
      남아 있습니다.<br />한 채와 여섯 채 연속 배치를 같은 배율로 비교할 수 있습니다. 아래 목록의
      건물을 누르면 해당 그림으로 바뀝니다.
    </p>
    <label
      >건물
      <select id="building"></select
    ></label>
    <button id="repeat">한 채 보기</button><button id="grid">부지 경계 표시</button>
    <label
      >배율
      <select id="zoom">
        <option value="1">100%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
      </select></label
    >
    <p id="status"></p>
    <main>
      <article>
        <h2>보정 전 원본</h2>
        <div class="scroll"><canvas id="before"></canvas></div>
      </article>
      <article>
        <h2>게임 적용본</h2>
        <div class="scroll"><canvas id="after"></canvas></div>
      </article>
    </main>
    <p>
      <a href="./terrainBuildingsVisual.html?case=flat">실제 렌더러 · 평지</a> ·
      <a href="./terrainBuildingsVisual.html?case=slope">경사</a> ·
      <a href="./terrainBuildingsVisual.html?case=front">앞쪽 높은 지형</a> ·
      <a href="./mansionFootprintVisual.html">승인한 저택 v2</a>
    </p>
    <h2>36종 전체 목록 · 원본 픽셀 크기</h2>
    <section id="catalog"></section>
    <script type="module" src="./buildingFootprintsVisual.ts"></script>
  </body>
</html>
