<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1418" />
    <title>1-9 도시</title>
  </head>
  <body>
    <div id="loading">지형을 그리는 중…</div>
    <div id="hud"></div>
    <div id="save-status" data-status="idle">저장됨</div>
    <div id="city-panel"></div>
    <div id="tools">
      <button id="btn-tool-select" type="button">선택</button>
      <button id="btn-tool-road" type="button">도로</button>
      <button id="btn-tool-zone-r" type="button" data-zone="r">주거</button>
      <button id="btn-tool-zone-c" type="button" data-zone="c">상업</button>
      <button id="btn-tool-zone-i" type="button" data-zone="i">공업</button>
      <button id="btn-tool-bulldoze" type="button">철거</button>
    </div>
    <div id="toolbar">
      <button id="btn-center" type="button">내 도시로</button>
      <button id="btn-fog" type="button">안개 보기</button>
      <button id="btn-grid" type="button">격자 보기</button>
      <button id="btn-save" type="button">저장</button>
      <button id="btn-logout" type="button">로그아웃</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
